<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quản trị sản phẩm - TechStore</title><link rel="stylesheet" href="assets/style.css"><script defer src="js/admin.js"></script></head><body><header class="admin-top"><div class="container"><a class="brand" href="/">Tech<span>Store</span> <small style="font-size:12px;letter-spacing:0">/ ADMIN</small></a><nav><a href="/">Xem website</a><a href="#" id="adminLogout">Đăng xuất</a></nav></div></header><main class="container page-section"><p class="eyebrow">BẢNG ĐIỀU KHIỂN</p><h1>Quản lý sản phẩm</h1><p class="muted">Thêm, sửa, ẩn sản phẩm; tải ảnh từ máy tính và cập nhật loại, giá, mô tả.</p><div id="adminMessage" class="admin-status"></div><div id="duplicateWarning" class="duplicate-warning" role="status" aria-live="polite" hidden></div><div class="admin-shell"><section class="admin-panel"><h2 id="formTitle">Thêm sản phẩm mới</h2><form id="productForm" class="admin-form" enctype="multipart/form-data"><input type="hidden" name="id"><label>Tên sản phẩm *<input name="name" required minlength="2" maxlength="180" placeholder="VD: iPhone 16 128GB"></label><label>Loại sản phẩm *<select name="category" required><option value="Điện thoại">Điện thoại</option><option value="Laptop">Laptop</option><option value="Máy tính bảng">Máy tính bảng</option><option value="Phụ kiện">Phụ kiện</option></select></label><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label>Giá bán (VNĐ) *<input name="price" type="number" min="0" step="1000" required></label><label>Giá cũ (VNĐ)<input name="oldPrice" type="number" min="0" step="1000" value="0"></label></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label>Nhãn<input name="tag" maxlength="50" value="Nổi bật"></label><label>Emoji dự phòng<input name="emoji" maxlength="16" value="📦"></label></div><label>Mô tả sản phẩm *<textarea name="description" rows="4" required minlength="5" maxlength="5000" placeholder="Mô tả chi tiết..."></textarea></label><label>Thông số (mỗi dòng một mục)<textarea name="specsText" rows="3" placeholder="Màn hình AMOLED&#10;Bộ nhớ 256GB"></textarea></label><label>Hình ảnh (JPG, PNG, WEBP, GIF; tối đa 5MB)<input name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><img id="imagePreview" class="image-preview" alt="Xem trước ảnh"></label><label>Hoặc đường dẫn ảnh<input name="imageUrl" type="url" placeholder="https://..."></label><label><input name="active" type="checkbox" checked style="display:inline;width:auto;margin-right:7px"> Hiển thị sản phẩm trên website</label><div class="form-actions"><button class="btn" type="submit">Lưu sản phẩm</button><button class="btn btn-secondary" type="button" id="resetForm">Làm mới</button></div></form><p class="admin-note">Ảnh tải lên được lưu trong public/uploads.</p></section><section class="admin-panel"><div class="admin-toolbar"><h2>Danh sách sản phẩm</h2><button class="btn btn-secondary" id="reloadProducts" type="button">Tải lại</button></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Ảnh</th><th>Sản phẩm</th><th>Giá</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody id="adminProducts"><tr><td colspan="5">Đang tải...</td></tr></tbody></table></div></section></div></main></body></html>
