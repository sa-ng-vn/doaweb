<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đặt hàng - TechStore</title><link rel="stylesheet" href="assets/style.css"><script defer src="js/app.js"></script></head><body><header class="site-header"><div class="container nav"><a class="brand" href="/">Tech<span>Store</span></a><nav><a href="cart.html">Quay lại giỏ hàng</a><span id="userNav"></span></nav></div></header><main class="container page-section narrow"><p class="eyebrow">BƯỚC CUỐI</p><h1>Thông tin đặt hàng</h1><div id="checkoutMessage"></div><form id="checkoutForm" class="form-card"><label>Họ và tên<input name="name" required minlength="2"></label><label>Số điện thoại<input name="phone" required pattern="[0-9+() .-]{9,16}"></label><label>Địa chỉ nhận hàng<input name="address" required minlength="5"></label><label>Ghi chú<textarea name="note" rows="3"></textarea></label><div id="checkoutTotal" class="checkout-total"></div><button class="btn btn-block">Xác nhận đặt hàng</button></form></main><footer class="footer"><div class="container footer-inner"><a class="brand" href="/">Tech<span>Store</span></a></div></footer></body></html>
