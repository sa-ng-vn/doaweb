<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kênh Seller - TechStore</title><link rel="stylesheet" href="assets/style.css"><script defer src="js/seller.js"></script></head>
<body><header class="admin-top"><div class="container"><a class="brand" href="/">Tech<span>Store</span> <small style="font-size:12px;letter-spacing:0">/ SELLER</small></a><nav><a href="/">Xem website</a> · <a href="#" id="sellerLogout">Đăng xuất</a></nav></div></header>
<main class="container page-section"><p class="eyebrow">KÊNH NGƯỜI BÁN</p><h1>Quản lý đơn hàng & hóa đơn</h1><p class="muted">Xem thông tin khách hàng, sản phẩm đã mua, tổng tiền và cập nhật trạng thái đơn hàng.</p><div id="sellerMessage" class="admin-status" role="status"></div>
<section class="admin-panel" style="margin-bottom:20px"><div class="seller-toolbar"><input id="orderSearch" type="search" placeholder="Tìm mã đơn, tên khách hoặc số điện thoại"><select id="orderStatus"><option value="">Tất cả trạng thái</option><option value="pending">Chờ xác nhận</option><option value="confirmed">Đã xác nhận</option><option value="shipping">Đang giao</option><option value="completed">Hoàn thành</option><option value="cancelled">Đã hủy</option></select><button class="btn btn-secondary" id="reloadOrders" type="button">Tải lại</button></div><div class="seller-stats" id="sellerStats"></div><div class="admin-table-wrap"><table class="admin-table seller-table"><thead><tr><th>Mã đơn</th><th>Khách hàng</th><th>Ngày đặt</th><th>Số lượng</th><th>Tổng tiền</th><th>Trạng thái</th><th>Chi tiết</th></tr></thead><tbody id="sellerOrders"><tr><td colspan="7">Đang tải đơn hàng...</td></tr></tbody></table></div></section>
<section class="admin-panel" id="invoicePanel" hidden><div class="admin-toolbar"><h2>Chi tiết hóa đơn <span id="invoiceCode"></span></h2><button class="btn btn-secondary" id="closeInvoice" type="button">Đóng</button></div><div id="invoiceContent"></div><button class="btn btn-secondary" id="printInvoice" type="button">In hóa đơn</button></section></main></body></html>
